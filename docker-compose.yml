name: lemalagasy 

services:
  frontoffice:
    image: node:20-alpine
    container_name: lemalagasy-frontoffice
    working_dir: /app
    volumes:
      - ./apps/frontoffice:/app
      - frontoffice_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:3000
    command: sh -c "if [ ! -d node_modules ] || [ ! -f node_modules/vite/package.json ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_started
    networks:
      - lemalagasy-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lemalagasy-backend
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html
    ports:
      - "3000:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lemalagasy_db
      - POSTGRES_USER=lemalagasy_user
      - POSTGRES_PASSWORD=lemalagasy_password
      - MONGO_URI=mongodb://mongo:27017/lemalagasy_db
    command: bash -lc "a2enmod rewrite && sed -ri 's!DocumentRoot /var/www/html!DocumentRoot /var/www/html/public!g' /etc/apache2/sites-available/000-default.conf && echo 'ServerName localhost' > /etc/apache2/conf-available/servername.conf && a2enconf servername && apache2-foreground"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - lemalagasy-net

  backoffice:
    image: node:20-alpine
    container_name: lemalagasy-backoffice
    working_dir: /app
    volumes:
      - ./apps/backoffice:/app
      - backoffice_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:3000
    command: sh -c "if [ ! -d node_modules ] || [ ! -f node_modules/vite/package.json ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5174"
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_started
    networks:
      - lemalagasy-net

  postgres:
    image: postgres:17
    container_name: lemalagasy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lemalagasy_db
      - POSTGRES_USER=lemalagasy_user
      - POSTGRES_PASSWORD=lemalagasy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemalagasy_user -d lemalagasy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lemalagasy-net

  mongo:
    image: mongo:7
    container_name: lemalagasy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lemalagasy-net

volumes:
  postgres_data:
  mongo_data:
  frontoffice_node_modules:
  backoffice_node_modules:

networks:
  lemalagasy-net:
    driver: bridge
